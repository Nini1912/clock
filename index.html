<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A responsive analog and digital clock built with HTML, CSS, and vanilla JavaScript." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <title>Analog Clock</title>
  </head>
  <body>
    <main class="clock-app">
      <header class="intro">
        <p class="eyebrow">Local time</p>
        <h1>Analog Clock</h1>
        <p class="subtitle">A minimal real-time clock built with vanilla JavaScript.</p>
      </header>

      <section class="clock-card" aria-label="Current local time">
        <div class="clock" aria-hidden="true">
          <span class="marker marker-12">12</span>
          <span class="marker marker-1">1</span>
          <span class="marker marker-2">2</span>
          <span class="marker marker-3">3</span>
          <span class="marker marker-4">4</span>
          <span class="marker marker-5">5</span>
          <span class="marker marker-6">6</span>
          <span class="marker marker-7">7</span>
          <span class="marker marker-8">8</span>
          <span class="marker marker-9">9</span>
          <span class="marker marker-10">10</span>
          <span class="marker marker-11">11</span>

          <div class="hand hour" data-hour-hand></div>
          <div class="hand minute" data-minute-hand></div>
          <div class="hand second" data-second-hand></div>
          <div class="center"></div>
        </div>

        <div class="time-panel" aria-live="polite">
          <p class="digital-time" data-digital-time>00:00:00</p>
          <p class="date" data-date>Loading date…</p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
